packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
neverBuiltDependencies:
  - sharp
