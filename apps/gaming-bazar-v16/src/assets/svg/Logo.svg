
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd23f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Geometric background pattern -->
  <g opacity="0.1">
    <path d="M 0 200 L 100 150 L 100 250 Z" fill="#ffffff"/>
    <path d="M 300 100 L 400 50 L 400 150 Z" fill="#ffffff"/>
    <path d="M 350 300 L 400 350 L 400 250 Z" fill="#ffffff"/>
  </g>
  
  <!-- Main shield/badge container -->
  <g filter="url(#shadow)">
    <!-- Shield background -->
    <path d="M 200 60 L 320 100 L 320 240 Q 320 280 200 340 Q 80 280 80 240 L 80 100 Z" 
          fill="#0f0f1e" 
          stroke="url(#glowGradient)" 
          stroke-width="3"/>
    
    <!-- Inner accent line -->
    <path d="M 200 75 L 305 110 L 305 235 Q 305 270 200 325 Q 95 270 95 235 L 95 110 Z" 
          fill="none" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          opacity="0.4"/>
  </g>
  
  <!-- GB Text -->
  <g filter="url(#glow)">
    <!-- G Letter -->
    <path d="M 140 160 Q 120 160 120 180 L 120 220 Q 120 240 140 240 L 170 240 L 170 210 L 145 210 L 145 200 L 180 200 L 180 245 Q 180 250 175 250 L 140 250 Q 110 250 110 220 L 110 180 Q 110 150 140 150 L 175 150 Q 180 150 180 155 L 180 165 L 140 165 Z" 
          fill="url(#glowGradient)"/>
    
    <!-- B Letter -->
    <path d="M 220 150 L 255 150 Q 280 150 280 175 Q 280 190 270 195 Q 280 200 280 215 Q 280 250 255 250 L 220 250 Z M 230 160 L 230 190 L 255 190 Q 270 190 270 175 Q 270 160 255 160 Z M 230 200 L 230 240 L 255 240 Q 270 240 270 220 Q 270 200 255 200 Z" 
          fill="url(#glowGradient)"/>
  </g>
  
  <!-- .com text -->
  <text x="300" y="325" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="url(#accentGradient)" 
        text-anchor="middle"
        filter="url(#glow)">.com</text>
  
  <!-- Decorative corner elements -->
  <g stroke="url(#glowGradient)" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 70 90 L 70 70 L 90 70"/>
    <path d="M 310 70 L 330 70 L 330 90"/>
    <path d="M 330 310 L 330 330 L 310 330"/>
    <path d="M 90 330 L 70 330 L 70 310"/>
  </g>
  
  <!-- Small accent dots -->
  <circle cx="200" cy="50" r="3" fill="url(#accentGradient)" opacity="0.8"/>
  <circle cx="60" cy="200" r="3" fill="url(#accentGradient)" opacity="0.8"/>
  <circle cx="340" cy="200" r="3" fill="url(#accentGradient)" opacity="0.8"/>
</svg>